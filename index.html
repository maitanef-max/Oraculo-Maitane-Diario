<title>index.html</title>
<style>
:root {
  --bg: #14121b;
  --bg-alt: #1c1828;
  --card: #201c2c;
  --ink: #ece6da;
  --ink-dim: #9c93ab;
  --accent: #c8a35c;
  --accent-dim: #8a7440;
  --rule: #362f47;
  --tension: #b5654a;
  --fluidez: #7fa98c;
  --activacion: #c8a35c;
  --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body: 'Work Sans', -apple-system, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  min-height: 100%;
  display: flex;
  justify-content: center;
  padding-inline: 16px;
  padding-block: 32px;
}
.wrap {
  width: 100%;
  max-width: 440px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.panel {
  background: linear-gradient(180deg, var(--card), var(--bg-alt));
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 22px 22px 26px;
  position: relative;
}
.panel::before {
  content: "";
  position: absolute;
  inset: 6px;
  border: 1px solid rgba(200,163,92,0.18);
  border-radius: 2px;
  pointer-events: none;
}
.eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 14px;
}
.eyebrow .date {
  color: var(--ink-dim);
  font-variant-numeric: tabular-nums;
}
h1 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 15px;
  letter-spacing: 0.02em;
  color: var(--ink-dim);
  text-transform: uppercase;
  margin: 0 0 10px;
}
.reading {
  font-family: var(--font-display);
  font-size: 19px;
  line-height: 1.45;
  color: var(--ink);
  text-wrap: balance;
  margin: 0 0 16px;
}
.readout {
  display: flex;
  gap: 10px;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ink-dim);
  border-top: 1px dashed var(--rule);
  padding-top: 12px;
}
.tag {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 20px;
  border: 1px solid currentColor;
}
.tag.Activación { color: var(--activacion); }
.tag.Tensión { color: var(--tension); }
.tag.Fluidez { color: var(--fluidez); }
.orb { margin-left: auto; font-variant-numeric: tabular-nums; }
.tarot-body {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.tarot-head {
  display: flex;
  gap: 14px;
  align-items: center;
}
.card-art {
  flex: 0 0 auto;
  width: 46px;
  height: 66px;
  border: 1px solid var(--accent-dim);
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(200,163,92,0.05);
  transition: transform 0.6s ease;
}
.card-art.reversed { transform: rotate(180deg); }
.card-art svg { width: 24px; height: 24px; stroke: var(--accent); fill: none; stroke-width: 2; }
.tarot-text { flex: 1; min-width: 0; }
.card-name {
  font-family: var(--font-display);
  font-size: 19px;
  color: var(--accent);
  margin: 0 0 3px;
}
.card-orient {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-dim);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  display: block;
}
.card-meaning {
  font-size: 14.5px;
  line-height: 1.6;
  color: var(--ink);
  margin: 0 0 12px;
}
.card-ambito {
  font-size: 13px;
  line-height: 1.5;
  color: var(--ink-dim);
  border-top: 1px dashed var(--rule);
  padding-top: 10px;
  margin: 0;
}
.card-ambito b {
  color: var(--accent);
  font-weight: 500;
}
.tecnica {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-dim);
  letter-spacing: 0.01em;
  margin: 0 0 10px;
}
button.draw {
  width: 100%;
  padding: 14px;
  background: transparent;
  border: 1px solid var(--accent-dim);
  color: var(--accent);
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  border-radius: 4px;
  cursor: pointer;
}
button.draw:hover { background: rgba(200,163,92,0.08); }
button.draw:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
footer {
  text-align: center;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-dim);
  opacity: 0.6;
  letter-spacing: 0.05em;
}
@media (prefers-reduced-motion: reduce) {
  .card-art { transition: none; }
}
</style>

    <div class="eyebrow"><span>Cielo de hoy</span><span class="date" id="fecha-astro"></span></div>

<script>
const TAROT = {"El Loco": {"arcano": "mayor", "derecho": "Un joven camina hacia el borde de un precipicio, mirando al cielo, con un hatillo al hombro y un perro que le sigue. No ve el vacío porque no le importa: confía en el paso siguiente antes de haberlo dado. Es el arquetipo del comienzo sin cálculo, de decir que sí antes de tener todas las garantías.", "invertido": "El mismo joven, pero cayendo o quedándose quieto justo antes del salto. Es la imprudencia de saltar sin mirar en absoluto, o el miedo que convierte el impulso en parálisis — las dos caras opuestas de no calcular nada.", "ambito": "No apunta a un área concreta: es la carta cero, antes de que el camino se defina, así que puede tocar cualquier parte de la vida donde se esté por dar un salto sin red —un cambio de ciudad, un proyecto, una relación que empieza sin saber bien en qué va a convertirse."}, "El Mago": {"arcano": "mayor", "derecho": "Un hombre de pie frente a una mesa con los cuatro elementos —copa, espada, bastón, pentáculo— alza una mano al cielo y señala la tierra con la otra. Tiene todo lo que necesita delante; la carta no habla de conseguir recursos, sino de decidirse a usarlos.", "invertido": "Los mismos elementos sobre la mesa, pero el gesto se vacía: hay talento y no se traduce en nada, o esa capacidad se usa para manipular en vez de para crear.", "ambito": "Suele hablar de trabajo o de un proyecto propio, porque la carta muestra los cuatro elementos ya disponibles sobre la mesa. En la práctica se ve como tener las herramientas, el contacto o la habilidad necesaria, y que lo único que falta sea decidirse a usarla."}, "La Sacerdotisa": {"arcano": "mayor", "derecho": "Una mujer serena se sienta entre dos columnas, una oscura y una clara, con un velo bordado de granadas detrás y un rollo de pergamino a medio ocultar en su regazo. Sabe algo que todavía no puede —o no debe— decir en voz alta.", "invertido": "El velo se cierra del todo, o la mujer se levanta de su asiento: información oculta que sale a destiempo, o la desconexión de la propia intuición por dejar de escucharla.", "ambito": "No apunta a un área concreta: el velo a medio correr habla de algo que todavía es interno —una intuición, un secreto propio— antes de que se sepa a qué parte de la vida corresponde. Forzar a qué área pertenece sería precisamente lo que la carta pide no hacer."}, "La Emperatriz": {"arcano": "mayor", "derecho": "Una mujer embarazada descansa en un trono rodeado de trigo maduro y un bosque frondoso, con un río corriendo cerca. No hace nada activamente: todo a su alrededor crece porque las condiciones están dadas.", "invertido": "El mismo paisaje, pero seco o descuidado: un crecimiento que se estanca por falta de atención, o un cuidado tan intenso que asfixia en vez de nutrir.", "ambito": "Suele hablar de creatividad o de algo en fase de crecimiento —un proyecto, un negocio, una idea que recién germina—, aunque en un contexto de maternidad o cuidado también puede apuntar ahí. Lo común entre ambas lecturas es algo que crece solo si se le da espacio."}, "El Emperador": {"arcano": "mayor", "derecho": "Un hombre de barba blanca se sienta en un trono de piedra tallado con cabezas de carnero, armadura bajo el manto, sosteniendo un cetro con forma de ankh. Gobierna por estructura, no por simpatía.", "invertido": "El mismo trono, pero vacío de autoridad real o con el hombre aferrado a él sin razón: control que se vuelve rígido, o una estructura que ya no protege a nadie, solo oprime.", "ambito": "Suele hablar de trabajo o de estructura, por la autoridad y el orden que representa el trono. También puede señalar la relación con una figura concreta de autoridad —un jefe, un cliente, una institución— más que con un vínculo afectivo."}, "El Hierofante": {"arcano": "mayor", "derecho": "Un sumo sacerdote, entre dos columnas y dos discípulos arrodillados, bendice con dos dedos alzados sosteniendo un cetro triple. Representa el saber ya codificado: una tradición, una institución, alguien que ya hizo este camino antes.", "invertido": "Los discípulos se levantan sin recibir la bendición, o el sacerdote pierde autoridad: un dogma que ya no tiene sentido propio, o una rebeldía necesaria frente a una norma vacía.", "ambito": "Suele hablar de aprendizaje, de una institución (trabajo, estudios, trámites) o de una tradición familiar con la que hay que posicionarse. Rara vez es sobre algo puramente emocional: el símbolo central es el código ya escrito, no el sentimiento."}, "Los Enamorados": {"arcano": "mayor", "derecho": "Un hombre y una mujer desnudos se miran bajo un ángel con los brazos extendidos, un árbol con serpiente detrás de ella y un árbol en llamas detrás de él. No es solo una carta de pareja: es una elección que revela qué se valora de verdad.", "invertido": "La misma escena, pero mirando en direcciones opuestas: valores desalineados, o una decisión que se sigue posponiendo por miedo a lo que implica elegir.", "ambito": "Suele hablar de amor, pero la carta original es sobre una elección de valores, no solo sobre pareja: puede aparecer igual de fuerte en una decisión de trabajo que exige decir qué se prioriza de verdad."}, "El Carro": {"arcano": "mayor", "derecho": "Un guerrero conduce un carro tirado por dos esfinges, una negra y otra blanca, que tiran en direcciones opuestas y sin embargo avanzan. La victoria viene de sostener el control sobre fuerzas contrarias, no de eliminarlas.", "invertido": "Las esfinges se separan y el carro se detiene: pérdida de rumbo, un conflicto interno que frena el avance en vez de impulsarlo.", "ambito": "Suele hablar de un proyecto o una meta concreta en marcha —tanto laboral como personal—, porque la imagen es literalmente de avance dirigido. Encaja bien con mudanzas, viajes o cualquier cosa que dependa de sostener el rumbo pese a fuerzas contrarias."}, "La Fuerza": {"arcano": "mayor", "derecho": "Una mujer, con un símbolo de infinito sobre la cabeza, cierra con calma las fauces de un león, sin forcejeo ni violencia. El dominio real no se impone a golpes: se sostiene con paciencia.", "invertido": "El león se resiste o la mujer pierde la calma: duda sobre la propia capacidad, o una fuerza que se vuelve agresiva precisamente porque no confía en sí misma.", "ambito": "No apunta a un área concreta: el gesto de dominar sin violencia aplica igual a una negociación de trabajo, a un vínculo afectivo tenso o a un hábito personal difícil de sostener. Lo que define la carta es el cómo, no el dónde."}, "El Ermitaño": {"arcano": "mayor", "derecho": "Un anciano encapuchado sostiene un farol con una estrella de seis puntas dentro, de pie en la cima de una montaña nevada, solo. Se ha alejado del ruido a propósito, porque desde ahí ve algo que desde abajo no se veía.", "invertido": "El farol se apaga o el anciano sigue bajando sin motivo: un aislamiento que ya dejó de aportar, o el rechazo a pedir ayuda cuando de verdad hace falta.", "ambito": "Suele hablar de vida interior o de la necesidad de distancia, más que de un tema externo concreto. Cuando aparece cerca de una pregunta de trabajo o vínculo, suele señalar que la respuesta pide primero soledad, no más información de fuera."}, "La Rueda de la Fortuna": {"arcano": "mayor", "derecho": "Una rueda gira en el cielo entre nubes, con criaturas simbólicas —esfinge, serpiente, chacal— aferradas o cayendo de ella. Nadie la empuja: gira por su propia inercia, y a todos les toca subir y bajar.", "invertido": "La rueda parece detenida, o alguien intenta frenarla con las manos: resistencia a un cambio que de todos modos va a pasar, o la sensación de estar a merced de una racha que se percibe injusta.", "ambito": "No apunta a un área concreta: la rueda gira por fuerzas ajenas a la voluntad, así que aplica a cualquier ámbito donde algo se sienta fuera de control —un cambio de suerte en el trabajo, la salud, el dinero o los vínculos."}, "La Justicia": {"arcano": "mayor", "derecho": "Una figura sostiene una espada erguida en una mano y una balanza equilibrada en la otra, sentada entre dos columnas, con la mirada al frente. No hay dramatismo: solo el peso exacto de los hechos.", "invertido": "La balanza se inclina, o la espada baja: una injusticia sin resolver, una cuenta pendiente, o alguien evitando hacerse responsable de su parte.", "ambito": "Suele hablar de algo legal, un contrato o un acuerdo formal, aunque también puede tratarse de una cuenta pendiente en un vínculo personal —una disculpa debida, una verdad que hay que decir. La balanza no distingue el terreno, solo pide equilibrio."}, "El Colgado": {"arcano": "mayor", "derecho": "Un hombre cuelga boca abajo de un pie, atado a un árbol vivo, con la otra pierna cruzada y una expresión tranquila, casi luminosa. No sufre: eligió quedarse así para ver el mundo desde otro ángulo.", "invertido": "El hombre se suelta a medias, incómodo: un sacrificio que ya no tiene sentido, o la resistencia a soltar algo que hace tiempo dejó de servir.", "ambito": "No apunta a un área concreta: pide soltar el control en cualquier situación donde se esté empujando sin resultado, sea trabajo, salud o un vínculo. Lo específico de la carta es la actitud —esperar en vez de forzar—, no el tema."}, "La Muerte": {"arcano": "mayor", "derecho": "Un esqueleto con armadura avanza a caballo con una bandera con una rosa blanca, mientras un rey cae, un niño y una doncella lo miran, y un obispo le pide clemencia. Nadie escapa al paso de la figura, pero detrás de ella sale el sol.", "invertido": "El esqueleto se detiene, o la figura del rey se aferra al suelo: la resistencia a un cierre que ya es inevitable, prolongando el desgaste en vez de dejarlo pasar.", "ambito": "Suele hablar de un cierre, y casi nunca de forma literal: puede ser una relación que termina, un puesto de trabajo, una etapa de vida entera o una forma de ser que ya no aplica. El dato importante es que algo necesita terminar para que otra cosa empiece."}, "La Templanza": {"arcano": "mayor", "derecho": "Un ángel con un pie en tierra y otro en el agua vierte líquido de una copa a otra, sin derramar nada, con un camino hacia montañas iluminadas al fondo. Es la mezcla hecha con paciencia, no de golpe.", "invertido": "El líquido se derrama entre las copas: una mezcla mal hecha, exceso en algún lado, falta de la mesura que la carta pide.", "ambito": "Suele hablar de equilibrio entre dos partes de la vida en tensión, muy a menudo trabajo y vida personal, o dos vínculos que compiten por tiempo o atención. La carta pide mezcla gradual, no elegir uno de los dos de golpe."}, "El Diablo": {"arcano": "mayor", "derecho": "Una pareja encadenada se sienta a los pies de una figura con cuernos y alas de murciélago, pero las cadenas están sueltas alrededor de sus cuellos: podrían quitárselas y no lo hacen. La atadura es real, pero también es una elección repetida.", "invertido": "Una de las figuras empieza a soltarse la cadena: el principio de una liberación, o la negación de que existe una cadena, viéndola y quedándose de todos modos.", "ambito": "Suele hablar de un apego o un patrón repetido, con frecuencia en dinero, vínculos o un hábito del que cuesta salir. La cadena suelta alrededor del cuello es la clave: la dependencia se sostiene también por elección, no solo por circunstancia."}, "La Torre": {"arcano": "mayor", "derecho": "Un rayo golpea una torre alta, la corona sale despedida y dos figuras caen desde lo alto entre llamas. Lo que se derrumba no sostenía nada real: solo lo parecía desde dentro.", "invertido": "El rayo se acerca pero no golpea aún: la ruptura que se demora, con la tensión acumulándose en vez de soltarse de una vez.", "ambito": "Suele hablar de un cambio brusco en algo estructural: trabajo, vivienda o una relación que dejó de sostenerse hace tiempo, aunque no se quisiera ver. Rara vez es sobre salud física directa, salvo si la pregunta apunta ahí."}, "La Estrella": {"arcano": "mayor", "derecho": "Una mujer desnuda vierte agua de dos jarras, una sobre la tierra y otra sobre un estanque, bajo un cielo con una estrella grande y siete pequeñas. Después de la caída de la Torre, esto es lo que queda: una calma que no es ingenua, fundada en lo que ya se atravesó.", "invertido": "Las jarras se vacían sin verter nada útil, o el cielo se nubla: desánimo, o una desconexión pasajera de la propia fe en que las cosas van a mejorar.", "ambito": "No apunta a un área concreta: llega después de una caída (la Torre en la secuencia del mazo) y ofrece esperanza en la zona que la necesite, sea salud, trabajo o vínculos. Es la carta de la reconstrucción, no de un tema específico."}, "La Luna": {"arcano": "mayor", "derecho": "Un camino serpentea entre dos torres bajo una luna con rostro, mientras un perro y un lobo aúllan y un cangrejo emerge del agua. Es terreno iluminado a medias: lo que se ve podría ser cierto, o podría ser solo sombra.", "invertido": "La niebla empieza a levantarse sobre el mismo camino: la confusión se disipa, o los miedos que parecían tan grandes se revelan infundados al mirarlos de frente.", "ambito": "Suele hablar de algo que todavía no está claro, y con más frecuencia de vínculos o decisiones afectivas, por toda la carga emocional e ilusoria que la carta representa. Menos común, pero posible, en dudas de trabajo cuando hay miedo de por medio."}, "El Sol": {"arcano": "mayor", "derecho": "Un niño desnudo monta un caballo blanco bajo un sol enorme con rostro, entre girasoles que se abren hacia él, sin sombra que lo cubra. Es la claridad sin filtro, la vitalidad que no necesita explicarse.", "invertido": "El mismo sol, pero parcialmente cubierto por una nube: un logro real que llega acompañado de algo que lo empaña, una alegría que no es completa todavía.", "ambito": "No apunta a un área concreta: señala vitalidad y algo que empieza a salir bien, en la zona que esté más activa en ese momento —puede ser un logro de trabajo o una alegría personal, la carta no distingue."}, "El Juicio": {"arcano": "mayor", "derecho": "Un ángel toca una trompeta desde las nubes y figuras humanas se levantan desnudas de sus tumbas con los brazos abiertos, respondiendo al llamado. Es un balance que no se puede seguir posponiendo.", "invertido": "Las figuras se resisten a levantarse, o se juzgan con más dureza de la que el momento pide: negarse al llamado, o una autocrítica que se pasa de exigente.", "ambito": "Suele hablar de la revisión de una etapa —trabajo, salud o un vínculo— que exige mirar hacia atrás antes de decidir el siguiente paso. Es una carta de balance, no de un tema fijo."}, "El Mundo": {"arcano": "mayor", "derecho": "Una figura danza suspendida dentro de una corona de laurel, con las cuatro criaturas de los evangelistas —ángel, águila, toro, león— en las esquinas. Es un ciclo que se cierra entero, no a medias.", "invertido": "La corona se rompe en algún punto, o la figura sigue danzando sin poder bajar: un cierre que falta completar, un último paso que aún no se ha dado.", "ambito": "Suele hablar del cierre de un ciclo, personal o profesional, que llega completo y no a medias. Encaja tanto con terminar un proyecto de trabajo como con cerrar una etapa vital entera."}, "As de Bastos": {"arcano": "menor", "palo": "Bastos", "derecho": "Una mano surge de una nube sosteniendo un bastón que brota hojas frescas, con un castillo lejano al fondo. Chispa creativa recién nacida: la idea de un proyecto o un impulso de hacer algo, todavía sin forma pero ya con vida propia.", "invertido": "En su forma invertida, esa semilla no llega a arraigar: una oportunidad que se desaprovecha o un comienzo que se frena antes de tomar forma, en el terreno de la acción, el trabajo o el impulso creativo.", "ambito": "Suele hablar de trabajo o de un proyecto creativo que arranca, porque el palo de bastos representa la acción y el impulso, no el sentimiento ni el dinero. Rara vez apunta a algo afectivo, salvo que se trate del deseo o la pasión dentro de una relación."}, "Dos de Bastos": {"arcano": "menor", "palo": "Bastos", "derecho": "Un hombre observa el horizonte desde lo alto de un castillo, sosteniendo un globo terráqueo, con un bastón fijo a su lado. Se ha conseguido una base y toca decidir hacia dónde expandirla: no es el arranque, es la planificación de lo que viene después.", "invertido": "En su forma invertida, el equilibrio no se logra: la indecisión se alarga, o lo que estaba en equilibrio se rompe, en el terreno de la acción, el trabajo o el impulso creativo.", "ambito": "Suele hablar de una decisión de expansión en el trabajo o en un proyecto propio: quedarse donde ya se está o mirar hacia un terreno nuevo. El globo terráqueo en la imagen es literal —se trata de alcance, no de sentimiento."}, "Tres de Bastos": {"arcano": "menor", "palo": "Bastos", "derecho": "Un hombre de espaldas contempla desde un acantilado cómo tres barcos zarpan mar adentro, con tres bastones clavados junto a él. Lo que se sembró ya está en marcha, fuera del propio control; toca esperar el resultado sin poder acelerarlo.", "invertido": "En su forma invertida, lo sembrado tarda en dar fruto, o el resultado decepciona frente a lo que se esperaba, en el terreno de la acción, el trabajo o el impulso creativo.", "ambito": "Suele hablar de trabajo: algo que ya se puso en marcha y ahora depende de factores externos, como barcos que ya zarparon. Menos frecuente en vínculos, salvo cuando se trata de un compromiso ya tomado que aún no dio resultado."}, "Cuatro de Bastos": {"arcano": "menor", "palo": "Bastos", "derecho": "Una guirnalda de flores cuelga entre cuatro bastones, con figuras bailando y celebrando al fondo, frente a un castillo. Un logro estable que se celebra: no la meta final, sino un descanso merecido y alegre en el camino.", "invertido": "En su forma invertida, la pausa se alarga más de lo necesario y se convierte en estancamiento, en el terreno de la acción, el trabajo o el impulso creativo.", "ambito": "Suele hablar de un logro laboral o creativo que se celebra, o de estabilidad lograda en el hogar —la guirnalda y el castillo de fondo sugieren ambas lecturas por igual."}, "Cinco de Bastos": {"arcano": "menor", "palo": "Bastos", "derecho": "Cinco jóvenes forcejean con sus bastones en direcciones distintas, sin coordinarse entre sí, en una escena de confusión más que de guerra real. Competencia sin dirección clara, desacuerdos de ego que consumen energía sin que nadie gane nada de fondo.", "invertido": "En su forma invertida, el conflicto se resuelve —o, al revés, se evita enfrentar del todo, dejándolo sin cerrar, en el terreno de la acción, el trabajo o el impulso creativo.", "ambito": "Suele hablar de competencia o desacuerdo en el trabajo, aunque puede darse en cualquier grupo donde varias personas compiten sin coordinarse. Rara vez es sobre un vínculo de a dos: la escena siempre implica a varios a la vez."}, "Seis de Bastos": {"arcano": "menor", "palo": "Bastos", "derecho": "Un jinete avanza con una corona de laurel en su bastón, aclamado por una multitud a pie que también sostiene bastones. Reconocimiento público, una victoria que se ve desde fuera — pero también vulnerable a depender de esa aprobación ajena.", "invertido": "En su forma invertida, ese logro se demora, llega desequilibrado o depende demasiado de la mirada de otros, en el terreno de la acción, el trabajo o el impulso creativo.", "ambito": "Suele hablar de reconocimiento en el trabajo o en un proyecto que se hace visible hacia fuera, porque la imagen central es una victoria pública, aclamada por otros, no una satisfacción privada."}, "Siete de Bastos": {"arcano": "menor", "palo": "Bastos", "derecho": "Un hombre se sostiene en lo alto de una colina, defendiéndose con su bastón contra otros seis que suben desde abajo. Se está en posición de ventaja, pero exige mantenerse firme bajo presión constante: no es el momento de ceder terreno.", "invertido": "En su forma invertida, se cede justo antes de conseguirlo, o se abandona la posición por cansancio, en el terreno de la acción, el trabajo o el impulso creativo.", "ambito": "Suele hablar de defender una posición en el trabajo frente a presión externa —una crítica, una competencia, un cuestionamiento a algo ya logrado. Puede aplicar a un vínculo si lo que se defiende es una forma personal de hacer las cosas."}, "Ocho de Bastos": {"arcano": "menor", "palo": "Bastos", "derecho": "Ocho bastones vuelan en el aire, en diagonal, sin que nada los detenga, sobre un paisaje despejado. Movimiento rápido, algo se acelera de golpe —noticias, decisiones, avances— después de un periodo más lento.", "invertido": "En su forma invertida, el movimiento se frena de golpe, o la energía se dispersa en demasiadas direcciones a la vez, en el terreno de la acción, el trabajo o el impulso creativo.", "ambito": "Suele hablar de trabajo o comunicación que se acelera de golpe: noticias, mensajes o eventos que se mueven rápido después de un tiempo más lento. Menos común en vínculos afectivos, donde la velocidad no suele ser el tema central."}, "Nueve de Bastos": {"arcano": "menor", "palo": "Bastos", "derecho": "Un hombre herido y cansado, pero de pie, sostiene un bastón mientras otros ocho forman una barrera detrás de él. Queda una última reserva de fuerza antes de terminar; el cansancio es real, pero también lo es la resistencia acumulada.", "invertido": "En su forma invertida, el agotamiento o la desconfianza no dejan ver que ya casi se ha llegado, en el terreno de la acción, el trabajo o el impulso creativo.", "ambito": "Suele hablar de resistencia en el trabajo, sostenida ya con las últimas fuerzas pero todavía en pie. Puede aplicar a cualquier esfuerzo prolongado, incluida la salud, si lo que se sostiene es física, no solo laboral."}, "Diez de Bastos": {"arcano": "menor", "palo": "Bastos", "derecho": "Un hombre camina agachado cargando diez bastones pesados entre los brazos, de espaldas, hacia una casa a lo lejos. El peso de la responsabilidad asumida, tan cerca de la meta como agotador llegar hasta ella cargando todo solo.", "invertido": "En su forma invertida, el peso acumulado se vuelve insostenible, aunque también puede señalar el alivio de por fin soltarlo, en el terreno de la acción, el trabajo o el impulso creativo.", "ambito": "Suele hablar de sobrecarga de responsabilidades, casi siempre en el trabajo, aunque también puede señalar cargar solo con algo que debería repartirse entre varios, dentro o fuera del ámbito laboral."}, "Sota de Bastos": {"arcano": "menor", "palo": "Bastos", "derecho": "Un joven examina su bastón con curiosidad en un paisaje árido, como si acabara de recibirlo. Una idea o un mensaje nuevo, con entusiasmo genuino pero todavía sin la experiencia para saber si va a funcionar.", "invertido": "En su forma invertida, el mensaje no llega, o el entusiasmo inicial se queda en inmadurez sin desarrollarse, en el terreno de la acción, el trabajo o el impulso creativo.", "ambito": "Suele hablar de una idea o mensaje nuevo relacionado con un proyecto o un interés creativo que recién empieza, todavía sin la experiencia para saber si va a funcionar."}, "Caballero de Bastos": {"arcano": "menor", "palo": "Bastos", "derecho": "Un jinete cabalga a toda velocidad, con plumas al viento, sobre un caballo que se encabrita. Impulso que se lanza sin pensarlo dos veces: puede ser el arranque que hacía falta o una salida demasiado precipitada.", "invertido": "En su forma invertida, la acción se precipita sin rumbo, o al contrario, se queda completamente detenida, en el terreno de la acción, el trabajo o el impulso creativo.", "ambito": "Suele hablar de un impulso de acción en el trabajo o en un proyecto personal —una salida repentina, una decisión tomada con más pasión que cálculo."}, "Reina de Bastos": {"arcano": "menor", "palo": "Bastos", "derecho": "Una mujer se sienta en un trono decorado con leones y girasoles, con un gato negro a sus pies y un bastón florecido en la mano. Confianza que no necesita alzar la voz: calidez independiente, magnetismo personal que atrae sin esfuerzo.", "invertido": "En su forma invertida, ese dominio se vuelve hacia dentro de forma excesiva, insegura o desconectada de los demás, en el terreno de la acción, el trabajo o el impulso creativo.", "ambito": "No apunta a un área concreta: describe una forma de estar en el mundo —confianza que no busca aprobación— más que un tema específico de la vida."}, "Rey de Bastos": {"arcano": "menor", "palo": "Bastos", "derecho": "Un hombre maduro se sienta en un trono con salamandras talladas, símbolo del fuego que no se quema a sí mismo, bastón florecido en mano. Liderazgo con visión de largo plazo: carisma que no busca brillar él mismo, sino encender la acción en los demás.", "invertido": "En su forma invertida, esa autoridad se ejerce con rigidez, o directamente está ausente cuando se la necesita, en el terreno de la acción, el trabajo o el impulso creativo.", "ambito": "Suele hablar de liderazgo en el trabajo o en un proyecto propio, con la particularidad de que el poder de esta carta inspira a otros a actuar, no solo actúa por sí mismo."}, "As de Copas": {"arcano": "menor", "palo": "Copas", "derecho": "Una mano surge de una nube sosteniendo una copa que rebosa cinco chorros de agua, con una paloma que desciende hacia ella. El corazón se abre de golpe: un afecto nuevo, una plenitud emocional que llega sin haber sido calculada.", "invertido": "En su forma invertida, esa semilla no llega a arraigar: una oportunidad que se desaprovecha o un comienzo que se frena antes de tomar forma, en el terreno emocional, de los vínculos o del propio disfrute.", "ambito": "Suele hablar de amor o de un vínculo afectivo que se abre, porque el palo de copas es el del mundo emocional. Rara vez apunta a trabajo o dinero, salvo que la pregunta sea explícitamente sobre eso."}, "Dos de Copas": {"arcano": "menor", "palo": "Copas", "derecho": "Un hombre y una mujer se miran a los ojos intercambiando copas, con un caduceo alado flotando entre ambos. Una unión basada en un afecto mutuo real, no en la conveniencia: reconciliación, sociedad o vínculo que empieza en equilibrio.", "invertido": "En su forma invertida, el equilibrio no se logra: la indecisión se alarga, o lo que estaba en equilibrio se rompe, en el terreno emocional, de los vínculos o del propio disfrute.", "ambito": "Suele hablar de amor o de una sociedad basada en afecto mutuo, no necesariamente de pareja romántica: puede ser una amistad o una colaboración que empieza en igualdad de condiciones."}, "Tres de Copas": {"arcano": "menor", "palo": "Copas", "derecho": "Tres mujeres bailan en círculo alzando sus copas, rodeadas de una cosecha abundante a sus pies. Celebración compartida, no en soledad: el cierre feliz de un esfuerzo colectivo, mejor disfrutado en compañía.", "invertido": "En su forma invertida, lo sembrado tarda en dar fruto, o el resultado decepciona frente a lo que se esperaba, en el terreno emocional, de los vínculos o del propio disfrute.", "ambito": "Suele hablar de amistad o de una celebración compartida con un grupo cercano, más que de una pareja: la imagen son tres figuras, no dos, y el foco está en la comunidad."}, "Cuatro de Copas": {"arcano": "menor", "palo": "Copas", "derecho": "Un hombre bajo un árbol, brazos cruzados, ignora una copa que le ofrece una mano desde una nube, mirando fijo otras tres copas frente a él. Apatía o insatisfacción frente a lo que ya se tiene, tan absorta en lo conocido que no ve la oportunidad que se le ofrece al lado.", "invertido": "En su forma invertida, la pausa se alarga más de lo necesario y se convierte en estancamiento, en el terreno emocional, de los vínculos o del propio disfrute.", "ambito": "Suele hablar de un vínculo o una rutina emocional de la que ya no se espera nada, sin ver lo que sí se está ofreciendo. También puede darse en el trabajo si el desinterés es hacia una oportunidad ya conocida."}, "Cinco de Copas": {"arcano": "menor", "palo": "Copas", "derecho": "Una figura de luto mira fijamente tres copas derramadas en el suelo, dándole la espalda a las dos que siguen en pie detrás de ella. El duelo se centra por completo en lo perdido, sin voltear todavía a ver lo que, pese a todo, sigue de pie.", "invertido": "En su forma invertida, el conflicto se resuelve —o, al revés, se evita enfrentar del todo, dejándolo sin cerrar, en el terreno emocional, de los vínculos o del propio disfrute.", "ambito": "Suele hablar de duelo afectivo, centrado en lo perdido de un vínculo, más que de una pérdida material. La escena es puramente emocional: tres copas caídas, sin nadie más presente."}, "Seis de Copas": {"arcano": "menor", "palo": "Copas", "derecho": "Dos niños intercambian copas llenas de flores en un jardín tranquilo, en una escena de calidez sencilla. Nostalgia o un reencuentro con algo del pasado —una persona, un lugar, una etapa— que vuelve sin pedirlo.", "invertido": "En su forma invertida, ese logro se demora, llega desequilibrado o depende demasiado de la mirada de otros, en el terreno emocional, de los vínculos o del propio disfrute.", "ambito": "Suele hablar de un reencuentro o un recuerdo afectivo del pasado, a menudo familiar o de infancia, más que de una relación nueva. Puede señalar a alguien —o a una etapa— que vuelve sin haber sido buscado."}, "Siete de Copas": {"arcano": "menor", "palo": "Copas", "derecho": "Una silueta mira siete copas suspendidas entre nubes, cada una con una visión distinta dentro: un castillo, joyas, una serpiente, una corona. Demasiadas opciones a la vez, algunas reales y otras solo fantasía: sin elegir una, ninguna se vuelve concreta.", "invertido": "En su forma invertida, se cede justo antes de conseguirlo, o se abandona la posición por cansancio, en el terreno emocional, de los vínculos o del propio disfrute.", "ambito": "Suele hablar de fantasía afectiva: demasiadas posibilidades sentimentales a la vez, sin decidir ninguna, aunque también puede aplicar a un exceso de opciones de trabajo si ninguna se examina con realismo."}, "Ocho de Copas": {"arcano": "menor", "palo": "Copas", "derecho": "Una figura se aleja de noche, de espaldas, dejando ocho copas cuidadosamente apiladas detrás de sí, caminando hacia las montañas. Un abandono voluntario de algo ya logrado, precisamente porque ya no basta: se deja atrás lo construido en busca de algo con más sentido.", "invertido": "En su forma invertida, el movimiento se frena de golpe, o la energía se dispersa en demasiadas direcciones a la vez, en el terreno emocional, de los vínculos o del propio disfrute.", "ambito": "Suele hablar de dejar atrás un vínculo o una situación afectiva que ya no satisface, aunque estuviera bien lograda. Menos frecuente, pero posible, en un trabajo estable que se abandona por falta de sentido."}, "Nueve de Copas": {"arcano": "menor", "palo": "Copas", "derecho": "Un hombre satisfecho, brazos cruzados, se sienta frente a nueve copas dispuestas en arco detrás de él, como un logro exhibido. Satisfacción genuina, un gusto o deseo cumplido con el que por fin se puede descansar sin culpa.", "invertido": "En su forma invertida, el agotamiento o la desconfianza no dejan ver que ya casi se ha llegado, en el terreno emocional, de los vínculos o del propio disfrute.", "ambito": "Suele hablar de satisfacción afectiva o de un placer personal ya conseguido —a veces llamada la carta de 'el deseo cumplido', por el hombre rodeado de sus copas como trofeos."}, "Diez de Copas": {"arcano": "menor", "palo": "Copas", "derecho": "Una pareja alza los brazos hacia un arcoíris con diez copas, mientras dos niños juegan cerca de la casa familiar. Plenitud emocional sostenida en el tiempo: no un momento de euforia, sino una armonía que ya se volvió costumbre.", "invertido": "En su forma invertida, el peso acumulado se vuelve insostenible, aunque también puede señalar el alivio de por fin soltarlo, en el terreno emocional, de los vínculos o del propio disfrute.", "ambito": "Suele hablar de plenitud familiar o de pareja, sostenida en el tiempo, porque la imagen incluye a los hijos jugando cerca de la casa: es armonía de largo plazo, no un pico de felicidad puntual."}, "Sota de Copas": {"arcano": "menor", "palo": "Copas", "derecho": "Un joven junto al mar mira con sorpresa un pez que asoma la cabeza desde el interior de su copa. Una sorpresa emocional o un mensaje sensible que llega de forma inesperada, con una curiosidad todavía sin experiencia detrás.", "invertido": "En su forma invertida, el mensaje no llega, o el entusiasmo inicial se queda en inmadurez sin desarrollarse, en el terreno emocional, de los vínculos o del propio disfrute.", "ambito": "Suele hablar de una sorpresa o un mensaje afectivo que llega sin avisar, con una curiosidad todavía sin experiencia detrás —puede ser una declaración, una noticia sentimental, un acercamiento inesperado."}, "Caballero de Copas": {"arcano": "menor", "palo": "Copas", "derecho": "Un jinete avanza despacio, con una copa extendida en la mano, junto a un río tranquilo. Una propuesta o una invitación afectiva que se acerca sin prisa: avance emocional sereno, no urgente.", "invertido": "En su forma invertida, la acción se precipita sin rumbo, o al contrario, se queda completamente detenida, en el terreno emocional, de los vínculos o del propio disfrute.", "ambito": "Suele hablar de una propuesta o un acercamiento romántico que avanza sin prisa, con el ritmo tranquilo del jinete junto al río, no con la urgencia del Caballero de Bastos."}, "Reina de Copas": {"arcano": "menor", "palo": "Copas", "derecho": "Una mujer en un trono junto al mar sostiene una copa cerrada y ornamentada, con la mirada perdida en sus propias aguas internas. Intuición profunda y empatía real, sostenida con la madurez de saber contener lo que siente sin desbordarse.", "invertido": "En su forma invertida, ese dominio se vuelve hacia dentro de forma excesiva, insegura o desconectada de los demás, en el terreno emocional, de los vínculos o del propio disfrute.", "ambito": "Suele hablar de vínculos: empatía y contención emocional hacia otra persona, sostenida con madurez —no de un logro externo, sino de una forma de acompañar."}, "Rey de Copas": {"arcano": "menor", "palo": "Copas", "derecho": "Un hombre se sienta en un trono que flota sobre un mar agitado, sosteniendo copa y cetro con total calma pese al oleaje. Control emocional maduro: diplomacia y estabilidad interior que no dependen de que el entorno esté en calma.", "invertido": "En su forma invertida, esa autoridad se ejerce con rigidez, o directamente está ausente cuando se la necesita, en el terreno emocional, de los vínculos o del propio disfrute.", "ambito": "Suele hablar de estabilidad emocional propia, sobre todo dentro de un vínculo, porque la carta muestra calma interior en medio de un entorno —el mar— que sigue agitado."}, "As de Espadas": {"arcano": "menor", "palo": "Espadas", "derecho": "Una mano surge de una nube sosteniendo una espada erguida, coronada con una corona de la que cuelgan una rama de olivo y otra de palma. Una claridad mental repentina, una verdad que corta de un solo golpe y no necesita repetirse.", "invertido": "En su forma invertida, esa semilla no llega a arraigar: una oportunidad que se desaprovecha o un comienzo que se frena antes de tomar forma, en el terreno de la mente, el conflicto o una verdad que cuesta decir.", "ambito": "Suele hablar de una decisión o una conversación que exige claridad total, en cualquier terreno —trabajo, vínculo o una verdad pendiente con una misma. El palo de espadas es el de la mente, no el del sentimiento ni el dinero."}, "Dos de Espadas": {"arcano": "menor", "palo": "Espadas", "derecho": "Una mujer con los ojos vendados cruza los brazos sosteniendo dos espadas, con el mar agitado y la luna detrás de ella. Un bloqueo entre dos decisiones, sostenido en parte a propósito: no ver es, también, una forma de no tener que elegir todavía.", "invertido": "En su forma invertida, el equilibrio no se logra: la indecisión se alarga, o lo que estaba en equilibrio se rompe, en el terreno de la mente, el conflicto o una verdad que cuesta decir.", "ambito": "Suele hablar de una decisión pendiente entre dos opciones, tanto personal como de vínculo, sostenida por la venda en los ojos: no ver es, en parte, una forma de aplazar."}, "Tres de Espadas": {"arcano": "menor", "palo": "Espadas", "derecho": "Un corazón atravesado por tres espadas, bajo un cielo de lluvia y nubes grises, sin figura humana alguna en la escena. Un dolor agudo y directo: una ruptura o una verdad que duele precisamente porque se dice, o se escucha, sin adornos.", "invertido": "En su forma invertida, lo sembrado tarda en dar fruto, o el resultado decepciona frente a lo que se esperaba, en el terreno de la mente, el conflicto o una verdad que cuesta decir.", "ambito": "Suele hablar de un dolor afectivo concreto —una ruptura, una verdad dicha sin filtro— más que de un tema laboral, por la imagen directa del corazón atravesado."}, "Cuatro de Espadas": {"arcano": "menor", "palo": "Espadas", "derecho": "Una figura yace sobre una tumba en actitud de descanso, con una espada y un vitral con la imagen de una bendición sobre ella. Un retiro necesario, no una derrota: hace falta pausar para sanar antes de volver a moverse.", "invertido": "En su forma invertida, la pausa se alarga más de lo necesario y se convierte en estancamiento, en el terreno de la mente, el conflicto o una verdad que cuesta decir.", "ambito": "No apunta a un área concreta: la pausa que pide la carta sirve igual para el trabajo, la salud o un vínculo agotado —lo común es la necesidad de detenerse antes de seguir."}, "Cinco de Espadas": {"arcano": "menor", "palo": "Espadas", "derecho": "Un hombre sonríe recogiendo espadas del suelo, mientras dos figuras se alejan derrotadas bajo un cielo turbulento. Una victoria que deja mal sabor: se gana, pero a costa de algo —una relación, la propia integridad— que no vale del todo la pena.", "invertido": "En su forma invertida, el conflicto se resuelve —o, al revés, se evita enfrentar del todo, dejándolo sin cerrar, en el terreno de la mente, el conflicto o una verdad que cuesta decir.", "ambito": "Suele hablar de un conflicto de trabajo o personal donde ganar deja mal sabor, porque la imagen muestra una victoria a costa de la relación con quien pierde."}, "Seis de Espadas": {"arcano": "menor", "palo": "Espadas", "derecho": "Un barquero lleva a una mujer y un niño a través de aguas tranquilas, con seis espadas clavadas de pie en la barca. Una transición hacia aguas más calmas: dejar atrás una dificultad, aunque el peso de lo vivido siga viajando con uno.", "invertido": "En su forma invertida, ese logro se demora, llega desequilibrado o depende demasiado de la mirada de otros, en el terreno de la mente, el conflicto o una verdad que cuesta decir.", "ambito": "Suele hablar de dejar atrás una dificultad —personal o práctica— hacia algo más tranquilo, con el peso de lo vivido todavía viajando en la misma barca, no resuelto del todo."}, "Siete de Espadas": {"arcano": "menor", "palo": "Espadas", "derecho": "Un hombre se aleja sigilosamente de un campamento cargando cinco espadas en brazos, dejando dos clavadas en el suelo detrás. Una estrategia que roza la evasión: una salida que resuelve algo, pero no del todo limpia ni transparente.", "invertido": "En su forma invertida, se cede justo antes de conseguirlo, o se abandona la posición por cansancio, en el terreno de la mente, el conflicto o una verdad que cuesta decir.", "ambito": "Suele hablar de una estrategia poco transparente, tanto en el trabajo como en un vínculo, porque la carta describe una salida a medias, sin que todo quede sobre la mesa."}, "Ocho de Espadas": {"arcano": "menor", "palo": "Espadas", "derecho": "Una mujer atada y con los ojos vendados está rodeada de ocho espadas clavadas en el suelo, aunque el camino detrás de ella está despejado. La sensación de estar atrapada pesa más que la trampa real: las propias percepciones limitan más que la situación en sí.", "invertido": "En su forma invertida, el movimiento se frena de golpe, o la energía se dispersa en demasiadas direcciones a la vez, en el terreno de la mente, el conflicto o una verdad que cuesta decir.", "ambito": "No apunta a un área concreta: la trampa de esta carta suele ser la propia percepción, más que la situación real —aplica a cualquier ámbito donde algo se sienta sin salida aunque no lo esté."}, "Nueve de Espadas": {"arcano": "menor", "palo": "Espadas", "derecho": "Una figura se sienta en la cama de noche con el rostro entre las manos, mientras nueve espadas cuelgan en la pared sobre ella. Angustia nocturna, pensamientos que giran sin descanso — más grandes en la cabeza, a esa hora, de lo que serán a la luz del día.", "invertido": "En su forma invertida, el agotamiento o la desconfianza no dejan ver que ya casi se ha llegado, en el terreno de la mente, el conflicto o una verdad que cuesta decir.", "ambito": "Suele hablar de ansiedad o pensamientos nocturnos, a menudo sin un origen único: la mente da vueltas sobre varios temas a la vez, más que sobre uno solo y claro."}, "Diez de Espadas": {"arcano": "menor", "palo": "Espadas", "derecho": "Una figura yace boca abajo con diez espadas clavadas en la espalda, mientras el cielo empieza a aclarar en el horizonte. Un final doloroso pero ya definitivo: se toca fondo justo en el instante en que, detrás, empieza a amanecer.", "invertido": "En su forma invertida, el peso acumulado se vuelve insostenible, aunque también puede señalar el alivio de por fin soltarlo, en el terreno de la mente, el conflicto o una verdad que cuesta decir.", "ambito": "Suele hablar de un final doloroso pero ya cerrado, en cualquier área que se sienta agotada —trabajo, vínculo o una etapa entera—, con la particularidad de que, en la imagen, justo detrás amanece."}, "Sota de Espadas": {"arcano": "menor", "palo": "Espadas", "derecho": "Un joven alerta empuña su espada con ambas manos, mientras el viento revuelve las nubes a su alrededor. Vigilancia y un mensaje directo: una mente ágil que exige claridad y no se conforma con medias verdades.", "invertido": "En su forma invertida, el mensaje no llega, o el entusiasmo inicial se queda en inmadurez sin desarrollarse, en el terreno de la mente, el conflicto o una verdad que cuesta decir.", "ambito": "Suele hablar de un mensaje o una conversación que exige mente clara y alerta, más frecuente en trabajo o trámites que en lo afectivo."}, "Caballero de Espadas": {"arcano": "menor", "palo": "Espadas", "derecho": "Un jinete carga a toda velocidad con la espada en alto, atravesando nubes de tormenta. Un impulso mental que se lanza a confrontar sin medir del todo las consecuencias: rapidez que puede ser valentía o precipitación.", "invertido": "En su forma invertida, la acción se precipita sin rumbo, o al contrario, se queda completamente detenida, en el terreno de la mente, el conflicto o una verdad que cuesta decir.", "ambito": "Suele hablar de una confrontación directa, tanto en el trabajo como en un vínculo, lanzada con más velocidad que reflexión."}, "Reina de Espadas": {"arcano": "menor", "palo": "Espadas", "derecho": "Una mujer en un trono alza una mano abierta y sostiene la espada erguida con la otra, mirada firme hacia el horizonte. Claridad sin sentimentalismo: independencia y una verdad dicha sin rodeos, aunque incomode.", "invertido": "En su forma invertida, ese dominio se vuelve hacia dentro de forma excesiva, insegura o desconectada de los demás, en el terreno de la mente, el conflicto o una verdad que cuesta decir.", "ambito": "Suele hablar de decir una verdad sin rodeos, en el terreno que haga falta —la carta no elige el tema, elige la forma: sin adornos."}, "Rey de Espadas": {"arcano": "menor", "palo": "Espadas", "derecho": "Un hombre se sienta en un trono con la espada erguida frente a él y la mirada de quien ya juzgó muchos casos antes, bajo un cielo despejado. Autoridad intelectual: decisiones basadas en lógica y experiencia, una justicia que puede ser fría pero es justa.", "invertido": "En su forma invertida, esa autoridad se ejerce con rigidez, o directamente está ausente cuando se la necesita, en el terreno de la mente, el conflicto o una verdad que cuesta decir.", "ambito": "Suele hablar de una decisión que exige lógica por encima de la emoción, con frecuencia en el trabajo o en algo legal, donde hace falta juzgar con la cabeza fría."}, "As de Oros": {"arcano": "menor", "palo": "Oros", "derecho": "Una mano surge de una nube sosteniendo un pentáculo dorado, sobre un jardín florecido con un camino que lleva hacia un arco lejano. Una oportunidad material concreta: la semilla de una estabilidad o una prosperidad que todavía hay que cultivar.", "invertido": "En su forma invertida, esa semilla no llega a arraigar: una oportunidad que se desaprovecha o un comienzo que se frena antes de tomar forma, en el terreno material, del cuerpo o del dinero.", "ambito": "Suele hablar de dinero o de una oportunidad material concreta, porque el palo de oros es el de lo tangible: cuerpo, trabajo y recursos, no sentimiento."}, "Dos de Oros": {"arcano": "menor", "palo": "Oros", "derecho": "Un joven hace malabares con dos monedas unidas por una cinta en forma de infinito, con barcos que se mecen en el mar de fondo. Equilibrio entre prioridades: un malabarismo entre recursos, tiempos o responsabilidades que exige mantenerse en movimiento.", "invertido": "En su forma invertida, el equilibrio no se logra: la indecisión se alarga, o lo que estaba en equilibrio se rompe, en el terreno material, del cuerpo o del dinero.", "ambito": "Suele hablar de malabarismo entre recursos —dinero, tiempo o responsabilidades— sostenido a la vez, más que de una sola prioridad clara."}, "Tres de Oros": {"arcano": "menor", "palo": "Oros", "derecho": "Un artesano trabaja tallando la piedra de una catedral, mientras dos figuras con planos revisan su obra. Trabajo que se ve y se valora: colaboración y maestría reconocida, un oficio que empieza a dar frutos visibles.", "invertido": "En su forma invertida, lo sembrado tarda en dar fruto, o el resultado decepciona frente a lo que se esperaba, en el terreno material, del cuerpo o del dinero.", "ambito": "Suele hablar de trabajo reconocido, sobre todo si implica colaborar con otros hacia un resultado visible, como el artesano y quienes revisan su obra en la imagen."}, "Cuatro de Oros": {"arcano": "menor", "palo": "Oros", "derecho": "Un hombre se aferra a una moneda sobre su cabeza, con otras dos bajo los pies y una más que abraza contra el pecho. Apego al control material: una seguridad construida sobre no soltar nada, aunque eso también impida recibir algo nuevo.", "invertido": "En su forma invertida, la pausa se alarga más de lo necesario y se convierte en estancamiento, en el terreno material, del cuerpo o del dinero.", "ambito": "Suele hablar de dinero: una seguridad construida sobre no soltar el control, aunque también puede aplicar a un vínculo si lo que se retiene es afecto, no solo recursos."}, "Cinco de Oros": {"arcano": "menor", "palo": "Oros", "derecho": "Dos figuras heridas y mal abrigadas caminan bajo la nieve, pasando frente a un vitral iluminado sin levantar la vista hacia él. Una carencia real, con la sensación de quedar fuera — mientras una ayuda cercana pasa desapercibida, justo al lado.", "invertido": "En su forma invertida, el conflicto se resuelve —o, al revés, se evita enfrentar del todo, dejándolo sin cerrar, en el terreno material, del cuerpo o del dinero.", "ambito": "Suele hablar de carencia material o de sentirse excluida de algo, con una ayuda cercana que no llega a verse —el vitral iluminado justo al lado del camino."}, "Seis de Oros": {"arcano": "menor", "palo": "Oros", "derecho": "Un hombre bien vestido reparte monedas entre dos personas necesitadas, sosteniendo una balanza en la otra mano. Generosidad que también implica una relación de poder: dar y recibir, con condiciones que conviene mirar de frente.", "invertido": "En su forma invertida, ese logro se demora, llega desequilibrado o depende demasiado de la mirada de otros, en el terreno material, del cuerpo o del dinero.", "ambito": "Suele hablar de dinero que se da o se recibe, con una relación de poder de por medio: quien reparte decide también las condiciones."}, "Siete de Oros": {"arcano": "menor", "palo": "Oros", "derecho": "Un agricultor se apoya en su azadón, observando con cansancio su cosecha de pentáculos, todavía sin recoger. Evaluación de un esfuerzo en curso: paciencia frente a un resultado que ya se acerca, pero que aún no está listo del todo.", "invertido": "En su forma invertida, se cede justo antes de conseguirlo, o se abandona la posición por cansancio, en el terreno material, del cuerpo o del dinero.", "ambito": "Suele hablar de un esfuerzo de trabajo o dinero que todavía no ha dado todo su resultado, y que exige paciencia antes de recoger la cosecha."}, "Ocho de Oros": {"arcano": "menor", "palo": "Oros", "derecho": "Un artesano trabaja concentrado, tallando un pentáculo tras otro con las manos manchadas de oficio. Disciplina y perfeccionamiento constante: dominar un oficio a base de repetición, sin atajos ni prisa.", "invertido": "En su forma invertida, el movimiento se frena de golpe, o la energía se dispersa en demasiadas direcciones a la vez, en el terreno material, del cuerpo o del dinero.", "ambito": "Suele hablar de trabajo: perfeccionar un oficio a base de repetición y disciplina, más que de un golpe de suerte o un logro puntual."}, "Nueve de Oros": {"arcano": "menor", "palo": "Oros", "derecho": "Una mujer serena pasea por su jardín con un halcón posado en el guante, rodeada de vides cargadas y pentáculos maduros. Independencia lograda por mérito propio: el disfrute tranquilo de una estabilidad que ya no depende de nadie más.", "invertido": "En su forma invertida, el agotamiento o la desconfianza no dejan ver que ya casi se ha llegado, en el terreno material, del cuerpo o del dinero.", "ambito": "Suele hablar de independencia económica lograda por mérito propio, con la calma de quien ya no depende de nadie más para sostenerse."}, "Diez de Oros": {"arcano": "menor", "palo": "Oros", "derecho": "Una familia entera, con un anciano, perros y niños, se reúne frente a una casa próspera bajo un arco con el árbol genealógico dibujado en pentáculos. Herencia y legado: una estabilidad que ya no es solo individual, sino que se sostiene a través de varias generaciones.", "invertido": "En su forma invertida, el peso acumulado se vuelve insostenible, aunque también puede señalar el alivio de por fin soltarlo, en el terreno material, del cuerpo o del dinero.", "ambito": "Suele hablar de dinero o legado familiar que trasciende lo individual, por la escena de varias generaciones reunidas bajo un mismo techo próspero."}, "Sota de Oros": {"arcano": "menor", "palo": "Oros", "derecho": "Un joven examina con atención un pentáculo que sostiene en alto, de pie en un campo fértil. Una oportunidad práctica que empieza: interés genuino por aprender un oficio, un negocio o una forma concreta de generar algo.", "invertido": "En su forma invertida, el mensaje no llega, o el entusiasmo inicial se queda en inmadurez sin desarrollarse, en el terreno material, del cuerpo o del dinero.", "ambito": "Suele hablar de una oportunidad práctica o de aprendizaje que empieza, a menudo relacionada con trabajo, estudios o una primera entrada de dinero."}, "Caballero de Oros": {"arcano": "menor", "palo": "Oros", "derecho": "Un jinete permanece quieto sobre un caballo detenido, mirando fijamente el pentáculo que sostiene en la mano. Método y paciencia: un avance lento pero seguro, sin atajos, que prioriza hacerlo bien por encima de hacerlo rápido.", "invertido": "En su forma invertida, la acción se precipita sin rumbo, o al contrario, se queda completamente detenida, en el terreno material, del cuerpo o del dinero.", "ambito": "Suele hablar de trabajo o dinero: avance lento pero seguro, sin atajos, priorizando hacerlo bien por encima de hacerlo rápido."}, "Reina de Oros": {"arcano": "menor", "palo": "Oros", "derecho": "Una mujer se sienta en un trono rodeado de naturaleza abundante, con un pentáculo en el regazo y un conejo asomando al fondo. Abundancia cuidada con las manos: generosidad práctica, atención al cuerpo, al hogar y a lo que sostiene la vida cotidiana.", "invertido": "En su forma invertida, ese dominio se vuelve hacia dentro de forma excesiva, insegura o desconectada de los demás, en el terreno material, del cuerpo o del dinero.", "ambito": "Suele hablar del cuerpo, el hogar o el dinero cuidado con las manos, de forma práctica y cotidiana, no abstracta."}, "Rey de Oros": {"arcano": "menor", "palo": "Oros", "derecho": "Un hombre se sienta en un trono decorado con uvas y cabezas de toro, sosteniendo con firmeza un pentáculo entre las manos. Éxito material ya consolidado: generosidad que nace de la seguridad, disfrute de algo que costó tiempo y trabajo ganar.", "invertido": "En su forma invertida, esa autoridad se ejerce con rigidez, o directamente está ausente cuando se la necesita, en el terreno material, del cuerpo o del dinero.", "ambito": "Suele hablar de éxito material ya consolidado, con la seguridad suficiente para disfrutarlo sin culpa ni urgencia de más."}};
const ASTRO = {"puntos_natales": ["Ascendente", "Sol", "Luna", "Stellium Virgo", "Venus", "Marte"], "categorias_base": {"Sol|Activación": "El Sol activa hoy tu identidad: es un día para que se note lo que haces, no para pasar desapercibida. Puede sentirse como ganas de hablar más alto en una reunión, publicar algo, o vestirte para que te vean.", "Sol|Tensión": "Tu forma de brillar hoy choca con algo de fuera: capaz alguien te pide que bajes el tono justo cuando querías subirlo, o al revés, te toca ocupar más espacio del que te sientes cómoda ocupando.", "Sol|Fluidez": "Hoy ser tú misma no cuesta nada: lo que muestras se recibe bien sin que tengas que explicarlo ni suavizarlo. Buen día para pedir algo, presentar algo, o simplemente aparecer.", "Luna|Activación": "Hoy se activa lo emocional: algo pide ser sentido, no solo resuelto con la cabeza. Puede aparecer como ganas de llorar sin razón aparente, o una necesidad repentina de estar con alguien que te dé calma.", "Luna|Tensión": "Tu necesidad de sentirte a salvo choca hoy con las circunstancias: un comentario cala más de lo que debería, o una rutina que te sostiene se ve interrumpida. No es el mejor día para exponerte a algo que ya sabes que te remueve.", "Luna|Fluidez": "El ánimo fluye fácil hoy: buen momento para cuidarte sin culpa, decir que no a un plan que no te apetece, o quedarte en casa sin sentir que te estás perdiendo algo.", "Venus|Activación": "Se activa el terreno de los vínculos o el placer: un afecto, un gusto o un gasto pide protagonismo. Puede traducirse en ganas de comprarte algo bonito, escribirle a alguien, o cuidar más tu imagen hoy.", "Venus|Tensión": "Lo que valoras choca hoy con una exigencia externa: un gasto que no tenías planeado, o un vínculo que pide algo distinto de lo que le puedes dar ahora mismo.", "Venus|Fluidez": "El disfrute fluye sin esfuerzo: buen día para el placer, un acercamiento, o simplemente disfrutar de algo bonito sin culpa ni cálculo de por medio.", "Marte|Activación": "Se activa el impulso de actuar: algo pide que te muevas ya, sin darle más vueltas. Buen día para mandar ese mensaje que llevas evitando o cerrar algo que solo necesitaba el primer paso.", "Marte|Tensión": "Tu forma de ir a por algo choca hoy con un obstáculo real: la mecha está corta, así que cuidado con la respuesta impulsiva a algo que en realidad merece más calma.", "Marte|Fluidez": "La acción fluye sin resistencia: lo que emprendas hoy avanza con menos esfuerzo del habitual — buen día para tachar cosas de la lista.", "Ascendente|Activación": "Se activa cómo te muestras al mundo: la energía con la que arrancas el día pide protagonismo desde temprano, casi sin que lo decidas tú.", "Ascendente|Tensión": "Tu forma de presentarte choca hoy con el entorno: cómo te perciben, o cómo arrancas el día, no encaja del todo con lo que te rodea — puede sentirse como ir a destiempo del resto.", "Ascendente|Fluidez": "Te muestras al mundo con soltura: la energía de arranque del día fluye sin que tengas que forzarla ni actuar un papel.", "Stellium Virgo|Activación": "Se activa el núcleo de tu identidad —mente, trabajo, cuerpo, sentido del deber— y pide atención en varios frentes a la vez, con fuerza. Puede sentirse como un día de mucho que hacer, pero también de mucha claridad.", "Stellium Virgo|Tensión": "Ese núcleo choca hoy con algo externo: exigencia sobre varios frentes a la vez —mente, trabajo, cuerpo— todo pidiendo atención al mismo tiempo y sin dar tregua.", "Stellium Virgo|Fluidez": "Ese núcleo encuentra hoy terreno fácil: puedes avanzar en varios frentes —trabajo, orden, cuerpo— sin que se sientan pesados. Buen día para lo pendiente."}, "sabor_planetas": {"Sol": "Es una energía de foco y vitalidad: hace visible lo que toca, para bien o para que se note de más.", "Luna": "Es una energía del día, pasajera: marca el ánimo de hoy, no una tendencia de fondo — mañana puede sentirse distinto.", "Mercurio": "Es una energía mental y rápida: buen momento para conversaciones, mensajes o papeleo, aunque también para malentendidos si vas con prisa.", "Venus": "Es una energía de vínculo y disfrute: dinero, afecto o gusto estético piden lugar hoy.", "Marte": "Es una energía de impulso: puede ser el motor que te faltaba o la mecha corta que no conviene encender.", "Jupiter": "Es una energía que amplifica: agranda lo que toca, así que conviene fijarse bien en qué está agrandando.", "Saturno": "Es una energía lenta y de fondo: pone límite o estructura, y a veces solo pone a prueba la paciencia.", "Urano": "Es una energía de quiebre: rompe el patrón habitual, aunque sea incómodo en el momento.", "Neptuno": "Es una energía difusa: puede inspirar o confundir, según cuánta claridad le exijas hoy.", "Pluton": "Es una energía profunda y lenta: remueve algo de raíz, no en la superficie — no espera resolverse en un día."}};

const GLYPHS = {"Bastos": "<path d=\"M32 8 C24 20 24 30 32 56 M32 8 C40 20 40 30 32 56\" stroke-linecap=\"round\"/>", "Copas": "<path d=\"M16 14 h32 c0 16 -8 24 -16 24 s-16 -8 -16 -24 z M32 38 v10 M22 56 h20\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>", "Espadas": "<path d=\"M32 6 v38 M22 16 h20 M24 44 l8 8 8 -8 M28 52 h8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>", "Oros": "<circle cx=\"32\" cy=\"32\" r=\"20\"/><circle cx=\"32\" cy=\"32\" r=\"10\"/>", "mayor": "<path d=\"M32 6 L37 24 L56 24 L41 35 L46 54 L32 43 L18 54 L23 35 L8 24 L27 24 Z\" stroke-linejoin=\"round\"/>"};

function hoyISO() {
  const d = new Date();
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function fechaLarga() {
  const d = new Date();
  return d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
}

// ---- ASTROLOGÍA ----
const ARTICULO_ASPECTO = {
  'Conjunción': 'una conjunción', 'Cuadratura': 'una cuadratura', 'Oposición': 'una oposición',
  'Trígono': 'un trígono', 'Sextil': 'un sextil',
};
function pintarAstro() {
  const hoy = hoyISO();
  document.getElementById('fecha-astro').textContent = fechaLarga();
  const t = TRANSITOS[hoy];
  const tec = document.getElementById('astro-tecnica');
  const el = document.getElementById('astro-texto');
  const ro = document.getElementById('astro-readout');
  if (!t) {
    tec.textContent = 'Sin tránsito exacto dentro de orbe hoy.';
    el.textContent = 'Día neutro, sin urgencia astrológica — buen momento para lo que ya tenías planeado, sin más ruido nuevo encima.';
    ro.innerHTML = '';
    return;
  }
  const base = ASTRO.categorias_base[`${t.punto}|${t.categoria}`] || '';
  const sabor = ASTRO.sabor_planetas[t.planeta] || '';
  const puntoTexto = t.punto === 'Stellium Virgo' ? 'tu stellium natal en Virgo' : `tu ${t.punto} natal`;
  tec.textContent = `${t.planeta} en tránsito forma ${ARTICULO_ASPECTO[t.aspecto]} con ${puntoTexto} — orbe ${t.orbe}°.`;
  el.textContent = `${base} ${sabor}`.trim();
  ro.innerHTML = `
    <span class="tag ${t.categoria}">${t.categoria}</span>
    <span>${t.planeta} ${t.aspecto} → ${t.punto}</span>
    <span class="orb">orbe ${t.orbe}°</span>
  `;
}

// ---- TAROT ----
function mulberry32(seed) {
  return function() {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seedDelDia(iso) {
  // semilla que combina la fecha con un componente aleatorio guardado localmente,
  // para que la tirada sea real (no derivable de la fecha) pero estable durante el día
  let salt = localStorage.getItem('oraculo_salt');
  if (!salt) {
    salt = String(Math.floor(Math.random() * 1e9));
    try { localStorage.setItem('oraculo_salt', salt); } catch(e) {}
  }
  let h = 0;
  const s = iso + '-' + salt;
  for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; }
  return h;
}

function svgDe(carta) {
  if (carta.arcano === 'mayor') return GLYPHS.mayor;
  return GLYPHS[carta.palo] || GLYPHS.mayor;
}

function pintarTarot() {
  const hoy = hoyISO();
  document.getElementById('fecha-tarot').textContent = fechaLarga();
  const cont = document.getElementById('tarot-contenido');

  let guardado = null;
  try { guardado = JSON.parse(localStorage.getItem('oraculo_tarot_' + hoy) || 'null'); } catch(e) {}

  if (guardado) {
    mostrarCarta(guardado.nombre, guardado.invertida);
    return;
  }

  cont.innerHTML = '<button class="draw" id="btn-tirar">Tirar la carta de hoy</button>';
  document.getElementById('btn-tirar').addEventListener('click', () => {
    const rand = mulberry32(seedDelDia(hoy));
    const nombres = Object.keys(TAROT);
    const nombre = nombres[Math.floor(rand() * nombres.length)];
    const invertida = rand() < 0.5;
    try { localStorage.setItem('oraculo_tarot_' + hoy, JSON.stringify({ nombre, invertida })); } catch(e) {}
    mostrarCarta(nombre, invertida);
  });
}

function mostrarCarta(nombre, invertida) {
  const carta = TAROT[nombre];
  if (!carta) return;
  const cont = document.getElementById('tarot-contenido');
  const significado = invertida ? carta.invertido : carta.derecho;
  cont.innerHTML = `
    <div class="tarot-body">
      <div class="tarot-head">
        <div class="card-art ${invertida ? 'reversed' : ''}"><svg viewBox="0 0 64 64">${svgDe(carta)}</svg></div>
        <div class="tarot-text">
          <p class="card-name">${nombre}</p>
          <span class="card-orient">${invertida ? 'invertida' : 'derecha'}${carta.palo ? ' · ' + carta.palo : ' · arcano mayor'}</span>
        </div>
      </div>
      <p class="card-meaning">${significado}</p>
      <p class="card-ambito"><b>Ámbito:</b> ${carta.ambito}</p>
    </div>
  `;
}

pintarAstro();
pintarTarot();
